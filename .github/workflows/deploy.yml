name: CI/CD AWS ECR & EC2 Deployment

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ==========================================
  # 1. BUILD & PUSH A ECR
  # ==========================================
  build-and-push:
    name: Build & Push a ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Backend Ventas
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/backend-venta:latest -f ./back-Ventas_SpringBoot/Springboot-API-REST/Dockerfile ./back-Ventas_SpringBoot/Springboot-API-REST
          docker push $REGISTRY/backend-venta:latest

      - name: Build & Push Backend Despachos
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/backend-despa:latest -f ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO/Dockerfile ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push $REGISTRY/backend-despa:latest

      - name: Build & Push Frontend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build --no-cache -t $REGISTRY/frontend:${{ env.IMAGE_TAG }} -f ./front_despacho/Dockerfile ./front_despacho
          docker push $REGISTRY/frontend:${{ env.IMAGE_TAG }}

  # ==========================================
  # 2. DEPLOY EN EC2 BACKEND
  # ==========================================
  deploy-backend:
    name: Despliegue en EC2 Backend (DB + Backends)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ejecutar despliegue vía AWS CLI (SSM)
        run: |
          REGISTRY_URL="${{ steps.login-ecr.outputs.registry }}"
          
          # Se usarán comandos nativos de docker para evitar dependencias de docker-compose en EC2
          cat << 'SCRIPT_EOF' > deploy_backend.sh
          #!/bin/bash
          set -e
          aws ecr get-login-password --region __REGION__ | docker login --username AWS --password-stdin __REGISTRY__
          
          # Descargar últimas imágenes
          docker pull __REGISTRY__/backend-venta:latest
          docker pull __REGISTRY__/backend-despa:latest
          
          # Crear red y volúmenes si no existen
          docker network create innovatech-net || true
          docker volume create db_data || true
          
          # Detener contenedores anteriores de forma segura (sin fallar si no existen)
          docker rm -f back-ventas back-despachos innovatech-db || true
          
          # 1. Levantar Base de Datos
          docker run -d --name innovatech-db --restart always --network innovatech-net \
            -v db_data:/var/lib/mysql \
            -e MYSQL_DATABASE=__DB_NAME__ \
            -e MYSQL_ROOT_PASSWORD=__DB_ROOT__ \
            -e MYSQL_USER=__DB_USER__ \
            -e MYSQL_PASSWORD=__DB_PWD__ \
            -p 3306:3306 mysql:8.0
            
          # Esperar a que MySQL esté listo
          echo "Esperando 15 segundos para la inicialización de MySQL..."
          sleep 15
          
          # 2. Levantar Backend Ventas
          docker run -d --name back-ventas --restart always --network innovatech-net \
            -p 8080:8080 \
            -e DB_ENDPOINT=innovatech-db \
            -e DB_PORT=3306 \
            -e DB_NAME=__DB_NAME__ \
            -e DB_USERNAME=__DB_USER__ \
            -e DB_PASSWORD=__DB_PWD__ \
            __REGISTRY__/backend-venta:latest

          # 3. Levantar Backend Despachos
          docker run -d --name back-despachos --restart always --network innovatech-net \
            -p 8081:8080 \
            -e DB_ENDPOINT=innovatech-db \
            -e DB_PORT=3306 \
            -e DB_NAME=__DB_NAME__ \
            -e DB_USERNAME=__DB_USER__ \
            -e DB_PASSWORD=__DB_PWD__ \
            __REGISTRY__/backend-despa:latest

          # Limpiar imágenes antiguas no utilizadas
          docker image prune -af
          SCRIPT_EOF

          # Inyectamos las variables reales (Secrets y Registry)
          sed -i "s|__REGISTRY__|$REGISTRY_URL|g; s|__REGION__|${{ secrets.AWS_REGION }}|g; s|__DB_NAME__|${{ secrets.MYSQL_DATABASE }}|g; s|__DB_ROOT__|${{ secrets.MYSQL_ROOT_PASSWORD }}|g; s|__DB_USER__|${{ secrets.MYSQL_APP_USER }}|g; s|__DB_PWD__|${{ secrets.MYSQL_APP_PASSWORD }}|g" deploy_backend.sh
          
          COMMAND_ID=$(aws ssm send-command --instance-ids "${{ secrets.ID_BACKEND }}" --document-name "AWS-RunShellScript" --parameters "{\"commands\":[\"echo $(base64 -w 0 deploy_backend.sh) | base64 -d | bash\"]}" --query "Command.CommandId" --output text)
          
          if ! aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ secrets.ID_BACKEND }}"; then
            echo "❌ Error en el despliegue del Backend."
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.ID_BACKEND }}" --query "StandardErrorContent" --output text
            exit 1
          fi

  # ==========================================
  # 3. DEPLOY EN EC2 FRONTEND
  # ==========================================
  deploy-frontend:
    name: Despliegue en EC2 Frontend (Solo Front)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ejecutar despliegue vía AWS CLI (SSM)
        run: |
          REGISTRY_URL="${{ steps.login-ecr.outputs.registry }}"
          
          cat << 'SCRIPT_EOF' > deploy_frontend.sh
          #!/bin/bash
          set -e
          aws ecr get-login-password --region __REGION__ | docker login --username AWS --password-stdin __REGISTRY__
          
          docker pull __REGISTRY__/frontend:__TAG__
          
          # Detener contenedor anterior de forma segura
          docker rm -f front-app || true
          
          # Levantar nuevo contenedor
          docker run -d --name front-app --restart always -p 80:80 \
            __REGISTRY__/frontend:__TAG__

          # Limpiar imágenes antiguas no utilizadas
          docker image prune -af
          SCRIPT_EOF

          # Inyectamos el TAG dinámico y la URL
          sed -i "s|__REGISTRY__|$REGISTRY_URL|g; s|__REGION__|${{ secrets.AWS_REGION }}|g; s|__TAG__|${{ env.IMAGE_TAG }}|g" deploy_frontend.sh

          COMMAND_ID=$(aws ssm send-command --instance-ids "${{ secrets.ID_FRONTEND }}" --document-name "AWS-RunShellScript" --parameters "{\"commands\":[\"echo $(base64 -w 0 deploy_frontend.sh) | base64 -d | bash\"]}" --query "Command.CommandId" --output text)
          
          if ! aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ secrets.ID_FRONTEND }}"; then
            echo "❌ Error en el despliegue del Frontend."
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.ID_FRONTEND }}" --query "StandardErrorContent" --output text
            exit 1
          fi